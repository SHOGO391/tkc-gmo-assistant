name: Preview checks
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  preview:
    name: Preview (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - run: npm run check
      - run: npx playwright install chromium
      - run: npm run test:e2e
      - run: npm run bundle:mac
      - run: npm run verify:mac-bundle
      - uses: actions/upload-artifact@v4
        if: matrix.os == 'macos-latest'
        with:
          name: tkc-gmo-assistant-mac
          path: |
            private/tkc-gmo-assistant-mac.zip
            private/tkc-gmo-assistant-mac.zip.sha256
          retention-days: 14
